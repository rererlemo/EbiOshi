<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY EBiDAN</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>MY EBiDAN</h1>
    <p>各グループの1推しを選んでね♡</p>
  </header>

  <div class="selector-area" id="selectors"></div>

  <h2 class="result-title">MY EBiDAN</h2>

  <div class="result" id="result"></div>

  <button class="reset" type="button" id="resetButton">
    選択をリセット
  </button>

  <script src="script.js"></script>
  
  <!-- =========================
     EBiDAN 好き顔診断
     ========================= -->

<section id="faceDiagnosis" class="face-diagnosis is-hidden">

  <div class="face-diagnosis-inner">

    <p class="face-kicker">
      EBiDAN 好き顔診断
    </p>

    <h2>
      💘 本選開催！
    </h2>

    <p class="face-intro">
      選んだ9人をシードにして、<br>
      ほかのメンバーも途中参戦！<br>
      「どっちの顔が好き？」を直感で選んでね♡
    </p>

    <div
      id="selectedFaceMembers"
      class="selected-face-members"
    ></div>

    <button
      id="startFaceDiagnosis"
      class="face-start"
      type="button"
    >
      💘 本選をスタート
    </button>

    <p
      id="faceProgress"
      class="face-progress"
    ></p>

    <div id="faceQuestionArea"></div>

    <div id="faceDiagnosisResult"></div>

  </div>

</section>

<script src="diagnosis.js"></script>
</body>
</html>
